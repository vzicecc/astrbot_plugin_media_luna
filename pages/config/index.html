<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Luna 全局配置</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f6fa;color:#222}
header{background:#1f2937;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0;flex:1}
main{padding:20px;max-width:900px;margin:0 auto}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #f3f4f6;padding:8px;text-align:left;vertical-align:top}
input,select{width:100%;box-sizing:border-box;padding:6px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
.desc{font-size:12px;color:#9ca3af}
button.primary{background:#3b82f6;color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}
button.small{background:#e5e7eb;color:#111;border:0;padding:4px 9px;border-radius:6px;cursor:pointer;font-size:13px}
.hint{color:#6b7280;font-size:13px;margin-top:6px}
.hidden{display:none}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0;display:none}
.msg.ok{background:#ecfdf5;color:#047857;display:block}
.msg.err{background:#fef2f2;color:#b91c1c;display:block}
#loadError{padding:10px 20px;background:#fef2f2;color:#b91c1c;font-size:14px;display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<header><h1>🌙 Media Luna 全局配置</h1></header>
<div id="loadError" class="hidden">
  <span id="loadErrorText">加载失败</span>
  <button class="small" onclick="load()">重试</button>
</div>
<main>
<div id="msgBox" class="msg"></div>
<div class="card">
  <h2>配置项</h2>
  <table>
    <thead><tr><th>配置项</th><th>值</th></tr></thead>
    <tbody id="configRows"></tbody>
  </table>
  <button class="primary" style="margin-top:8px" onclick="saveConfig()">保存配置</button>
  <div class="hint">保存目录留空 = 默认保存在插件目录（当前: <span id="curSaveDir"></span>）。密钥类字段保留 **** 表示不修改。</div>
</div>
</main>

<script>
let state = {config:[]};

function endpoint(path){
  return 'page/' + String(path||'').replace(/^\/+/,'').replace(/\/+/g,'/');
}
function unwrap(resp){
  const body = resp && resp.data && resp.data.status ? resp.data : resp;
  if(body && body.status === 'ok') return body.data || {};
  if(body && body.status === 'error') throw new Error(body.message || '请求失败');
  return body;
}
async function bridgeReady(){
  let b = window.AstrBotPluginPage;
  const deadline = Date.now() + 3000;
  while(!b && Date.now() < deadline){
    await new Promise(r=>setTimeout(r,100));
    b = window.AstrBotPluginPage;
  }
  if(!b) throw new Error('AstrBot 插件页桥接 SDK 未加载');
  await b.ready();
  return b;
}
async function api(path, method, body){
  const b = await bridgeReady();
  if(method === 'POST') return unwrap(await b.apiPost(endpoint(path), body || {}));
  return unwrap(await b.apiGet(endpoint(path), body || {}));
}

function msg(text, ok){const b=document.getElementById('msgBox');b.textContent=text;b.className='msg '+(ok?'ok':'err');setTimeout(()=>b.className='msg',5000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  try{
    document.getElementById('loadError').classList.add('hidden');
    state = await api('state');
    document.getElementById('curSaveDir').textContent = state.saveDir;
    renderConfig();
  }catch(e){
    document.getElementById('loadErrorText').textContent='加载失败：'+e.message;
    document.getElementById('loadError').classList.remove('hidden');
    msg('加载失败：'+e.message,false);
  }
}

function renderConfig(){
  const tb=document.getElementById('configRows');tb.innerHTML='';
  for(const item of state.config){
    const tr=document.createElement('tr');
    const td1=document.createElement('td');
    td1.textContent=item.name||item.key;
    if(item.description){const d=document.createElement('div');d.className='desc';d.textContent=item.description;td1.appendChild(d);}
    const td2=document.createElement('td');
    let inp=document.createElement('input');
    inp.dataset.key=item.key;
    if(typeof item.value==='boolean'){
      inp=document.createElement('select');
      const o1=document.createElement('option');o1.value='true';o1.textContent='开启';
      const o2=document.createElement('option');o2.value='false';o2.textContent='关闭';
      inp.appendChild(o1);inp.appendChild(o2);inp.value=item.value?'true':'false';inp.dataset.bool='1';
    }else if(typeof item.value==='number'){
      inp.type='number';inp.value=item.value;
    }else{
      inp.value=item.masked?'****':item.value;
    }
    td2.appendChild(inp);tr.appendChild(td1);tr.appendChild(td2);tb.appendChild(tr);
  }
}

async function saveConfig(){
  const updates={};
  document.querySelectorAll('#configRows input, #configRows select').forEach(inp=>{
    if(inp.dataset.bool)updates[inp.dataset.key]=inp.value==='true';
    else if(inp.type==='number')updates[inp.dataset.key]=Number(inp.value);
    else if(inp.value==='****')return;
    else updates[inp.dataset.key]=inp.value;
  });
  await api('config','POST',updates);
  msg('配置已保存',true);
  await load();
}

load();
</script>
</body>
</html>
